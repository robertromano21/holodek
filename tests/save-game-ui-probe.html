async function put(database, store, key, value) { await new Promise((resolve, reject) => { const tx = database.transaction(store, 'readwrite'), s = tx.objectStore(store); s.keyPath ? s.put(value) : s.put(value, key); tx.oncomplete = resolve; tx.onerror = () => reject(tx.error); }); }
