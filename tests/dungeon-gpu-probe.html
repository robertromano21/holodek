<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dungeon GPU Upload Probe</title>
<canvas id="gpu"></canvas>
<div id="dungeon-popup" style="display:block"><div id="dungeon-container"></div></div>
<pre id="results">Running...</pre>
<script src="../assets/masonryPatterns.js"></script>
<script src="../assets/voxelMaterials.js"></script>
<script src="../assets/scenePropVoxels.js"></script>
<script src="../assets/rendererWebGL.js"></script>
<script>
try {
  const renderer = window.webglDungeonRenderer;
  const initStarted = performance.now();
  renderer.canvas = document.getElementById('gpu');
  const initialContext = renderer.canvas.getContext('webgl2', { alpha: false, depth: true });
  const initialDebug = initialContext?.getExtension('WEBGL_debug_renderer_info');
  console.info('[RendererStartup]', JSON.stringify({ stage: 'probe-adapter', adapter:
    initialDebug ? initialContext.getParameter(initialDebug.UNMASKED_RENDERER_WEBGL) : 'Unavailable' }));
  if (!renderer.init(document.body)) throw new Error('WebGL2 unavailable or production shader compilation failed');
  const gl = renderer.gl;
  const initializationMs = Math.round(performance.now() - initStarted);
  const debugRenderer = gl.getExtension('WEBGL_debug_renderer_info');
  const adapter = debugRenderer ? gl.getParameter(debugRenderer.UNMASKED_RENDERER_WEBGL) : 'Unavailable';
  if (!renderer.voxelProgram) throw new Error('Production voxel shader compilation failed');
  const results = [];
  for (const incomingFlip of [false, true]) {
    // Sprite uploads leave this global WebGL state enabled before the next room.
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, incomingFlip);
    const dungeon = {
      geoKey: incomingFlip ? '0,0,1' : '0,0,0',
      _geometryStamp: String(incomingFlip),
      layout: { width: 3, height: 4 },
      cells: {
        '1,0': { tile: 'torch', floorHeight: 0, ceilHeight: 2.5 },
        '0,1': { tile: 'floor', floorHeight: 8, ceilHeight: 10.5 },
        '2,2': { tile: 'floor', floorHeight: -7, ceilHeight: -4.5 },
        '1,3': { tile: 'floor', floorHeight: 0.5, ceilHeight: 3,
          roof: { height: 4.5, slopeX: 0.25, slopeY: 0, style: 'barrel' } }
      }
    };
    renderer.rebuildDungeonTextures(dungeon, {});
    const report = renderer.getRenderingDiagnostics(dungeon);
    results.push({ incomingFlip, ...report, glError: gl.getError() });
  }
  // A below-eye triangle crossing the camera plane must not streak into the upper screen.
  renderer.canvas.width = renderer.canvas.height = 64;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, 64, 64);
  gl.useProgram(renderer.voxelProgram);
  gl.disable(gl.CULL_FACE); gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  const u = renderer.voxelUniforms;
  gl.uniform2f(u.resolution, 64, 64); gl.uniform2f(u.camPos, 0, 0);
  gl.uniform2f(u.camDir, 1, 0); gl.uniform2f(u.plane, 0, 1);
  gl.uniform1f(u.focalLength, 32); gl.uniform1f(u.eyeZ, 0.25);
  gl.uniform1f(u.depthFarDepth, 64); gl.uniform1f(u.depthBias, 0); gl.uniform1f(u.unlit, 1);
  gl.uniform3f(u.modelPos, 0, 0, 0); gl.uniform3f(u.modelScale, 1, 1, 1);
  const vertices = new Float32Array([-0.5, 0, 0, 0, 0, 1, 1, 0, 0,
    1, -0.5, 0, 0, 0, 1, 1, 0, 0, 1, 0.5, 0, 0, 0, 1, 1, 0, 0]);
  const vbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
  for (const [attribute, offset] of [[renderer.voxelAttribs.pos, 0], [renderer.voxelAttribs.norm, 12], [renderer.voxelAttribs.color, 24]]) {
    gl.enableVertexAttribArray(attribute); gl.vertexAttribPointer(attribute, 3, gl.FLOAT, false, 36, offset);
  }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const pixels = new Uint8Array(64 * 64 * 4); gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  let upperPixels = 0, lowerPixels = 0;
  for (let y = 0; y < 64; y++) for (let x = 0; x < 64; x++) if (pixels[(y * 64 + x) * 4] > 0) {
    if (y >= 32) upperPixels++; else lowerPixels++;
  }
  const nearClip = { upperPixels, lowerPixels, glError: gl.getError() };
  const voxelColors = [];
  for (const primary of ['#993344', '#335599']) {
    const dungeon = { layout: { width: 3, height: 4 }, cells: {}, geoKey: primary, _geometryStamp: primary,
      visualStyle: { palette: primary === '#993344' ? { primary, secondary: '#551122', highlight: '#dd8888', shadow: '#220011' } :
        { primary, secondary: '#113355', highlight: '#88bbdd', shadow: '#001122' } },
      tiles: { custom_pediment: { spriteSpec: { voxelShape: 'pediment', material: 'marble' } } } };
    renderer.rebuildDungeonTextures(dungeon, {});
    const mesh = renderer.getVoxelMesh('custom_pediment', dungeon);
    const vertex = new Float32Array(9);
    gl.bindBuffer(gl.ARRAY_BUFFER, mesh.vbo); gl.getBufferSubData(gl.ARRAY_BUFFER, 0, vertex);
    voxelColors.push({ palette: primary, color: Array.from(vertex.slice(6, 9)), texturesOn: mesh._debugKey.endsWith('textures:1'), glError: gl.getError() });
  }
  const paletteApplied = voxelColors[0].color[0] > voxelColors[0].color[2] &&
    voxelColors[1].color[2] > voxelColors[1].color[0] && voxelColors.every(c => c.texturesOn && c.glError === gl.NO_ERROR);
  // Positive control: reproduce the old vertex-teleport bug on exactly the same triangle.
  const badVs = gl.createShader(gl.VERTEX_SHADER), redFs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(badVs, `#version 300 es
    in vec3 a_pos;
    void main() {
      if (a_pos.x <= 0.02) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); return; }
      gl_Position = vec4(a_pos.y, a_pos.z - 0.25, 0.0, a_pos.x);
    }`);
  gl.shaderSource(redFs, '#version 300 es\nprecision highp float; out vec4 color; void main() { color = vec4(1,0,0,1); }');
  gl.compileShader(badVs); gl.compileShader(redFs);
  const badProgram = gl.createProgram(); gl.attachShader(badProgram, badVs); gl.attachShader(badProgram, redFs); gl.linkProgram(badProgram);
  if (!gl.getProgramParameter(badProgram, gl.LINK_STATUS)) throw new Error('Near-clip positive-control shader failed');
  gl.useProgram(badProgram);
  const pos = gl.getAttribLocation(badProgram, 'a_pos');
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.enableVertexAttribArray(pos); gl.vertexAttribPointer(pos, 3, gl.FLOAT, false, 36, 0);
  gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  nearClip.legacyUpperPixels = 0;
  for (let y = 32; y < 64; y++) for (let x = 0; x < 64; x++) {
    if (pixels[(y * 64 + x) * 4] > 0) nearClip.legacyUpperPixels++;
  }
  gl.deleteProgram(badProgram); gl.deleteShader(badVs); gl.deleteShader(redFs); gl.deleteBuffer(vbo);
  const makeTexture = color => {
    const c = document.createElement('canvas'); c.width = c.height = 8;
    const ctx = c.getContext('2d'); ctx.fillStyle = color; ctx.fillRect(0, 0, 8, 8);
    c.complete = true; c.naturalWidth = c.naturalHeight = 8;
    return c;
  };
  window.WEBGPU_VOXEL_PREWARM = false;
  window.dungeonTextures = { wall: makeTexture('#ff0000'), floor: makeTexture('#00ff00') };
  window.playerDungeonX = 1; window.playerDungeonY = 3;
  window.playerPosX = 1.5; window.playerPosY = 3.5; window.playerAngle = 0;
  // The full production shaders above compile unchanged. Visibility fixtures have
  // zero lights: specialize only their light accumulator to avoid the software
  // driver's costly shadow JIT while keeping the actual world traversal verbatim.
  const shaderSource = gl.shaderSource.bind(gl);
  gl.shaderSource = (shader, source) => {
    const start = source.indexOf('float accumulateTorchLit(');
    if (start >= 0 && source.includes('float floorHeightFromCell')) {
      const opening = source.indexOf('{', start);
      let depth = 1, end = opening + 1;
      while (depth && end < source.length) { if (source[end] === '{') depth++; if (source[end] === '}') depth--; end++; }
      source = source.slice(0, opening + 1) +
        '\nshadowBlend = 0.0; primaryDir2D = vec2(0.0); primaryStrengthOut = 0.0; return 0.0;\n}' + source.slice(end);
    }
    shaderSource(shader, source);
  };
  if (!renderer.init(document.body)) throw new Error('No-light visibility specialization failed');
  gl.shaderSource = shaderSource;
  // Clear the deleted positive-control program's vertex state before world drawing.
  gl.useProgram(renderer.program);
  for (let attribute = 0; attribute < gl.getParameter(gl.MAX_VERTEX_ATTRIBS); attribute++) gl.disableVertexAttribArray(attribute);
  while (gl.getError() !== gl.NO_ERROR) {}
  const visibility = [];
  for (const mode of ['low-wall-only', 'mountain-behind-wall', 'looking-over-wall']) {
    const dungeon = { geoKey: mode, _geometryStamp: mode, layout: { width: 32, height: 8 }, cells: {}, tiles: {},
      classification: { indoor: false }, skyTop: '#0000ff', skyBot: '#0000ff', lighting: { intensity: 0 } };
    for (let y = 0; y < 8; y++) for (let x = 0; x < 32; x++) dungeon.cells[`${x},${y}`] = {
      tile: x === 3 || mode === 'mountain-behind-wall' && x === 8 ? 'wall' : 'floor',
      floorHeight: 0, ceilHeight: mode === 'mountain-behind-wall' && x === 8 ? 6 : x === 3 ? 1 : 2.5 };
    window.currentDungeon = dungeon; window.playerZ = mode === 'looking-over-wall' ? 4 : .65;
    renderer.renderScene();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let upperWalls = 0, lowerFloor = 0;
    for (let y = 0; y < 64; y++) for (let x = 24; x < 40; x++) {
      const i = (y * 64 + x) * 4;
      if (y > 54 && pixels[i] > 0 && pixels[i] > pixels[i + 2] * 2) upperWalls++;
      if (y < 20 && pixels[i + 1] > 0 && pixels[i + 1] > pixels[i] * 2) lowerFloor++;
    }
    visibility.push({ mode, upperWalls, lowerFloor, glError: gl.getError() });
  }
  const horizonPass = visibility[0].upperWalls === 0 && visibility[1].upperWalls > 0 &&
    visibility[2].lowerFloor > 0 && visibility.every(v => v.glError === gl.NO_ERROR);
  const downhill = [];
  const flat = { geoKey: 'downhill-view', _geometryStamp: 'downhill-view', layout: { width: 32, height: 8 }, cells: {}, tiles: {},
    classification: { indoor: false }, skyTop: '#0000ff', skyBot: '#0000ff', lighting: { intensity: 0 } };
  for (let y = 0; y < 8; y++) for (let x = 0; x < 32; x++) flat.cells[`${x},${y}`] = { tile: 'floor', floorHeight: 0, ceilHeight: 2.5 };
  window.currentDungeon = flat; window.playerZ = .65;
  for (const shift of [0, -.1]) {
    window.dungeonViewShift = shift; renderer.renderScene();
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.readPixels(0, 0, 64, 64, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    let floorPixels = 0;
    for (let y = 0; y < 64; y++) for (let x = 24; x < 40; x++) {
      const i = (y * 64 + x) * 4;
      if (pixels[i + 1] > 0 && pixels[i + 1] > pixels[i + 2] * 2) floorPixels++;
    }
    downhill.push({ shift, floorPixels, glError: gl.getError() });
  }
  window.dungeonViewShift = 0;
  const downhillPass = downhill[1].floorPixels > downhill[0].floorPixels && downhill.every(v => v.glError === gl.NO_ERROR);
  document.getElementById('results').textContent = JSON.stringify({
    shadersCompiled: true,
    initializationMs, adapter, startupEvents: renderer.startupEvents,
    pass: results.every(result => result.gpuUploadByteMismatches === 0 && result.glError === gl.NO_ERROR) &&
      upperPixels === 0 && lowerPixels > 0 && nearClip.legacyUpperPixels > 0 && nearClip.glError === gl.NO_ERROR && paletteApplied && horizonPass && downhillPass,
      results, nearClip, voxelColors, paletteApplied, visibility, horizonPass, downhill, downhillPass
  });
} catch (error) {
  document.getElementById('results').textContent = JSON.stringify({ error: error.message });
}
</script>
</html>
